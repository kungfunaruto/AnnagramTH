<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0B1530">
<title>AnagramTH</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="banner" class="banner" role="status" hidden></div>

<div id="screens">
  <!-- Thai and English word screens are filled in by js/words.js -->
  <section id="screen-thai" class="screen words-screen" data-lang="thai" aria-label="ไทย"></section>
  <section id="screen-english" class="screen words-screen" data-lang="english" aria-label="อังกฤษ" hidden></section>

  <!-- ============================ MATH (filled in by js/math-ui.js) ============================ -->
  <section id="screen-math" class="screen math-screen" aria-label="คณิต" hidden></section>

  <!-- ============================ TIMER ============================ -->
  <section id="screen-timer" class="screen timer" aria-label="นาฬิกาจับเวลา" hidden>
    <button class="clock" data-p="1" aria-label="นาฬิกาผู้เล่น 2">
      <span class="who">ผู้เล่น 2</span><span class="time">25:00</span><span class="sub"></span>
    </button>
    <div class="clock-bar">
      <button id="t-pause" class="round" aria-label="หยุดชั่วคราว">⏸</button>
      <button id="t-minutes" class="pill-btn" aria-label="ตั้งเวลาต่อผู้เล่น">25 นาที</button>
      <button id="t-reset" class="round" aria-label="เริ่มใหม่">↺</button>
    </div>
    <button class="clock" data-p="0" aria-label="นาฬิกาผู้เล่น 1">
      <span class="who">ผู้เล่น 1</span><span class="time">25:00</span><span class="sub"></span>
    </button>
  </section>

  <!-- ============================ SETTINGS ============================ -->
  <section id="screen-settings" class="screen" aria-label="ตั้งค่า" hidden>
    <header class="top"><h1 class="title">ตั้งค่า</h1></header>
    <div class="scroll pad" id="settings-body"></div>
  </section>
</div>

<nav class="tabbar" role="tablist" aria-label="เมนูหลัก">
  <button role="tab" data-screen="thai" aria-selected="true"><span class="ic">ก</span><span>ไทย</span></button>
  <button role="tab" data-screen="english" aria-selected="false"><span class="ic">A</span><span>อังกฤษ</span></button>
  <button role="tab" data-screen="math" aria-selected="false"><span class="ic">±</span><span>คณิต</span></button>
  <button role="tab" data-screen="timer" aria-selected="false"><svg class="ic-svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>เวลา</span></button>
  <button role="tab" data-screen="settings" aria-selected="false"><svg class="ic-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm8.4 4.6-.9-.5a7.6 7.6 0 0 0 0-1.2l.9-.5a1 1 0 0 0 .4-1.3l-1-1.7a1 1 0 0 0-1.3-.4l-.9.5a7.5 7.5 0 0 0-1-.6V6.3a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v1a7.5 7.5 0 0 0-1 .6l-.9-.5a1 1 0 0 0-1.3.4l-1 1.7a1 1 0 0 0 .4 1.3l.9.5a7.6 7.6 0 0 0 0 1.2l-.9.5a1 1 0 0 0-.4 1.3l1 1.7a1 1 0 0 0 1.3.4l.9-.5c.3.2.6.4 1 .6v1a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-1c.4-.2.7-.4 1-.6l.9.5a1 1 0 0 0 1.3-.4l1-1.7a1 1 0 0 0-.4-1.3Z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>ตั้งค่า</span></button>
</nav>

<dialog id="minutes-dialog" class="sheet" aria-labelledby="minutes-title">
  <h3 id="minutes-title">เวลาต่อผู้เล่น</h3>
  <div class="chips-row" id="minutes-chips"></div>
  <div class="stepper">
    <button type="button" class="round" data-step="-1" aria-label="ลด 1 นาที">−</button>
    <span><b id="minutes-value">25</b> นาที</span>
    <button type="button" class="round" data-step="1" aria-label="เพิ่ม 1 นาที">+</button>
  </div>
  <form method="dialog" class="sheet-actions">
    <button class="btn" value="cancel">ยกเลิก</button>
    <button class="btn primary" value="ok">ตั้งเวลา</button>
  </form>
</dialog>
<dialog id="confirm-dialog" class="sheet">
  <p id="confirm-text"></p>
  <form method="dialog" class="sheet-actions">
    <button class="btn" value="cancel">ยกเลิก</button>
    <button class="btn primary" value="ok" id="confirm-ok">ตกลง</button>
  </form>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
